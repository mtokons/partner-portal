services:
  portal:
    build: .
    image: partner-portal-portal:latest
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - CV_TAILOR_API_URL=http://cv-tailor:8001
      - MODEL_TEST_API_URL=http://model-test:8002
      - NODE_OPTIONS=--max-old-space-size=384 --expose-gc
    restart: always
    mem_limit: 450m
    mem_reservation: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"
    depends_on:
      - cv-tailor
      - model-test

  cv-tailor:
    build: ./cv-tailor
    image: partner-portal-cv-tailor:latest
    ports:
      - "8001:8001"
    env_file:
      - .env.production
    restart: always
    mem_limit: 250m
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

  model-test:
    build: ./model-test-system
    image: partner-portal-model-test:latest
    ports:
      - "8002:8002"
    restart: always
    mem_limit: 200m
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

  # Reverse proxy for automatic SSL
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - portal
      - wordpress

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-changeme}
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - db_data:/var/lib/mysql
    mem_limit: 512m

  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-changeme}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_data:/var/www/html
    mem_limit: 512m

volumes:
  caddy_data:
  caddy_config:
  db_data:
  wordpress_data:
