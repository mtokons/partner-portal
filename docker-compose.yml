services:
  portal:
    build: .
    image: partner-portal-portal:latest
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - CV_TAILOR_API_URL=http://cv-tailor:8001
      - MODEL_TEST_API_URL=http://model-test:8002
      - NODE_OPTIONS=--max-old-space-size=384 --expose-gc
    restart: always
    mem_limit: 450m
    mem_reservation: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"
    depends_on:
      - cv-tailor
      - model-test

  cv-tailor:
    build: ./cv-tailor
    image: partner-portal-cv-tailor:latest
    ports:
      - "8001:8001"
    env_file:
      - .env.production
    restart: always
    mem_limit: 250m
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

  model-test:
    build: ./model-test-system
    image: partner-portal-model-test:latest
    ports:
      - "8002:8002"
    restart: always
    mem_limit: 200m
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

  # Reverse proxy for automatic SSL
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - portal

volumes:
  caddy_data:
  caddy_config:
